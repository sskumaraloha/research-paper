<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Platform Console</title>
<style>
  :root {
    --bg: #f4f6f8; --panel: #ffffff; --text: #1f2933; --muted: #6b7280;
    --accent: #2563eb; --accent-dark: #1d4ed8; --error: #b91c1c; --ok: #15803d;
    --border: #e5e7eb; --side: #111827; --side-text: #e5e7eb; --side-active: #2563eb;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b1020; --panel: #1f2937; --text: #f3f4f6; --muted: #9ca3af;
      --accent: #3b82f6; --accent-dark: #2563eb; --error: #f87171; --ok: #4ade80;
      --border: #374151; --side: #0f172a; --side-text: #cbd5e1; --side-active: #3b82f6;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text); min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  /* --- login --- */
  #loginView { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; }
  .card { background: var(--panel); border-radius: 12px; padding: 32px; width: 100%; max-width: 380px;
          box-shadow: 0 4px 16px rgba(0,0,0,0.1); }
  .card h1 { font-size: 1.25rem; margin: 0 0 4px; }
  .card p { color: var(--muted); font-size: 0.85rem; margin: 0 0 20px; }
  label { display: block; font-size: 0.85rem; margin: 12px 0 5px; }
  input { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px;
          background: transparent; color: var(--text); font-size: 0.95rem; }
  input:focus { outline: 2px solid var(--accent); border-color: transparent; }
  .btn { width: 100%; margin-top: 18px; padding: 10px; border: none; border-radius: 8px;
         background: var(--accent); color: #fff; font-size: 0.95rem; font-weight: 600; cursor: pointer; }
  .btn:hover { background: var(--accent-dark); }
  .msg { margin-top: 12px; font-size: 0.85rem; color: var(--error); min-height: 1.1em; }
  /* --- shell --- */
  #appView { display: none; min-height: 100vh; }
  .shell { display: flex; min-height: 100vh; }
  nav {
    width: 210px; background: var(--side); color: var(--side-text); padding: 20px 0;
    display: flex; flex-direction: column; flex-shrink: 0;
  }
  nav .brand { font-weight: 700; padding: 0 20px 18px; font-size: 1rem; color: #fff; }
  nav button {
    background: none; border: none; color: var(--side-text); text-align: left; cursor: pointer;
    padding: 11px 20px; font-size: 0.92rem; width: 100%;
  }
  nav button.active { background: var(--side-active); color: #fff; border-radius: 0 20px 20px 0; }
  nav .spacer { flex: 1; }
  nav .who { padding: 10px 20px; font-size: 0.78rem; color: var(--muted); }
  main { flex: 1; padding: 26px; min-width: 0; }
  main h2 { margin: 0 0 16px; font-size: 1.15rem; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
  .tile { background: var(--panel); border-radius: 10px; padding: 16px; border: 1px solid var(--border); }
  .tile .v { font-size: 1.5rem; font-weight: 700; }
  .tile .l { color: var(--muted); font-size: 0.78rem; margin-top: 2px; }
  table { width: 100%; border-collapse: collapse; background: var(--panel); border-radius: 10px;
          overflow: hidden; font-size: 0.88rem; }
  th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 600; font-size: 0.78rem; text-transform: uppercase; }
  tr.click { cursor: pointer; }
  tr.click:hover td { background: rgba(37,99,235,0.08); }
  .pill { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 0.72rem;
          background: rgba(37,99,235,0.15); color: var(--accent); }
  .section { margin-bottom: 24px; }
  .back { background: none; border: none; color: var(--accent); cursor: pointer; padding: 0;
          font-size: 0.85rem; margin-bottom: 12px; }
  .empty { color: var(--muted); font-size: 0.88rem; padding: 14px; }
  @media (max-width: 720px) {
    .shell { flex-direction: column; }
    nav { width: 100%; flex-direction: row; overflow-x: auto; padding: 8px; align-items: center; }
    nav .brand { padding: 0 12px; }
    nav button.active { border-radius: 8px; }
    nav .spacer, nav .who { display: none; }
  }
</style>
</head>
<body>

<div id="loginView">
  <div class="card">
    <h1>Platform Console</h1>
    <p>Software-owner sign in (PLATFORM_ADMIN)</p>
    <form id="loginForm">
      <label for="email">Email</label>
      <input type="email" id="email" required autocomplete="username">
      <label for="password">Password</label>
      <input type="password" id="password" required autocomplete="current-password">
      <button class="btn" type="submit">Sign in</button>
    </form>
    <div class="msg" id="loginMsg" role="alert"></div>
  </div>
</div>

<div id="appView">
  <div class="shell">
    <nav>
      <div class="brand">MIP Console</div>
      <button data-view="overview" class="active">Overview</button>
      <button data-view="orgs">Organisations</button>
      <button data-view="activity">Activity</button>
      <button data-view="users">Users</button>
      <div class="spacer"></div>
      <div class="who" id="who"></div>
      <button id="logoutBtn">Sign out</button>
    </nav>
    <main id="content"></main>
  </div>
</div>

<script>
(function () {
  var token = null;
  var me = null;

  function el(id) { return document.getElementById(id); }

  function api(path) {
    return fetch(path, { headers: { 'Authorization': 'Bearer ' + token } }).then(function (res) {
      if (res.status === 401) { logout(); throw new Error('Session expired'); }
      if (!res.ok) {
        return res.json().then(function (b) { throw new Error(b.message || ('HTTP ' + res.status)); });
      }
      return res.json();
    });
  }

  // --- auth ---
  el('loginForm').addEventListener('submit', function (event) {
    event.preventDefault();
    el('loginMsg').textContent = '';
    fetch('/api/auth/login', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: el('email').value, password: el('password').value })
    }).then(function (res) {
      return res.json().then(function (body) {
        if (!res.ok) { throw new Error(body.message || 'Login failed'); }
        if (body.user.role !== 'PLATFORM_ADMIN') {
          throw new Error('This console is for the platform owner (PLATFORM_ADMIN) only.');
        }
        token = body.accessToken; me = body.user;
        el('who').textContent = me.fullName + ' (' + me.role + ')';
        el('loginView').style.display = 'none';
        el('appView').style.display = 'block';
        show('overview');
      });
    }).catch(function (e) { el('loginMsg').textContent = e.message; });
  });

  function logout() {
    token = null; me = null;
    el('appView').style.display = 'none';
    el('loginView').style.display = 'flex';
    el('password').value = '';
  }
  el('logoutBtn').addEventListener('click', logout);

  // --- navigation ---
  var navButtons = document.querySelectorAll('nav button[data-view]');
  navButtons.forEach(function (button) {
    button.addEventListener('click', function () { show(button.dataset.view); });
  });

  function show(view) {
    navButtons.forEach(function (b) { b.classList.toggle('active', b.dataset.view === view); });
    el('content').innerHTML = '<div class="empty">Loading&hellip;</div>';
    if (view === 'overview') { renderOverview(); }
    if (view === 'orgs') { renderOrgs(); }
    if (view === 'activity') { renderActivity(); }
    if (view === 'users') { renderUsers(); }
  }

  function esc(value) {
    var div = document.createElement('div');
    div.textContent = value == null ? '' : String(value);
    return div.innerHTML;
  }

  // --- views ---
  function renderOverview() {
    api('/api/platform/overview').then(function (o) {
      var tiles = [
        ['Organisations', o.organisations], ['Plants', o.plants], ['Users', o.users],
        ['Machines', o.machines], ['Records', o.maintenanceRecords],
        ['Records (30d)', o.recordsLast30Days], ['Import jobs', o.importJobs],
        ['Pending validation', o.pendingValidations]
      ];
      el('content').innerHTML = '<h2>Platform overview</h2><div class="tiles">'
        + tiles.map(function (t) {
            return '<div class="tile"><div class="v">' + esc(t[1]) + '</div><div class="l">'
              + esc(t[0]) + '</div></div>';
          }).join('') + '</div>';
    }).catch(showError);
  }

  function renderOrgs() {
    api('/api/platform/organisations').then(function (orgs) {
      if (!orgs.length) {
        el('content').innerHTML = '<h2>Organisations</h2><div class="empty">No organisations yet.</div>';
        return;
      }
      var rows = orgs.map(function (o) {
        return '<tr class="click" data-id="' + o.id + '"><td>' + esc(o.name)
          + ' <span class="pill">' + esc(o.code) + '</span></td><td>' + o.plantCount
          + '</td><td>' + o.userCount + '</td><td>' + o.machineCount + '</td><td>'
          + o.recordCount + '</td><td>' + o.importJobCount + '</td><td>'
          + (o.lastActivityAt ? esc(o.lastActivityAt.substring(0, 10)) : '-') + '</td></tr>';
      }).join('');
      el('content').innerHTML = '<h2>Subscriber organisations</h2><table><thead><tr>'
        + '<th>Organisation</th><th>Plants</th><th>Users</th><th>Machines</th>'
        + '<th>Records</th><th>Imports</th><th>Last activity</th></tr></thead><tbody>'
        + rows + '</tbody></table>';
      el('content').querySelectorAll('tr.click').forEach(function (row) {
        row.addEventListener('click', function () { renderOrgDetail(row.dataset.id); });
      });
    }).catch(showError);
  }

  function renderOrgDetail(id) {
    api('/api/platform/organisations/' + id).then(function (org) {
      var plants = org.plants.length ? org.plants.map(function (p) {
        return '<tr><td>' + esc(p.name) + ' <span class="pill">' + esc(p.code) + '</span></td><td>'
          + p.machineCount + '</td><td>' + p.recordCount + '</td><td>'
          + p.downtimeLast30DaysMinutes + ' min</td><td>' + p.pendingValidations + '</td></tr>';
      }).join('') : '<tr><td colspan="5" class="empty">No plants.</td></tr>';
      var users = org.users.length ? org.users.map(function (u) {
        return '<tr><td>' + esc(u.fullName) + '</td><td>' + esc(u.email) + '</td><td>'
          + esc(u.role) + '</td><td>' + (u.active ? 'active' : 'inactive') + '</td></tr>';
      }).join('') : '<tr><td colspan="4" class="empty">No users assigned.</td></tr>';
      el('content').innerHTML = '<button class="back" id="backBtn">&larr; All organisations</button>'
        + '<h2>' + esc(org.name) + ' <span class="pill">' + esc(org.code) + '</span></h2>'
        + '<div class="section"><table><thead><tr><th>Plant</th><th>Machines</th><th>Records</th>'
        + '<th>Downtime (30d)</th><th>Pending validation</th></tr></thead><tbody>' + plants
        + '</tbody></table></div>'
        + '<div class="section"><table><thead><tr><th>User</th><th>Email</th><th>Role</th>'
        + '<th>Status</th></tr></thead><tbody>' + users + '</tbody></table></div>';
      el('backBtn').addEventListener('click', function () { show('orgs'); });
    }).catch(showError);
  }

  function renderActivity() {
    api('/api/audit?size=50').then(function (page) {
      var rows = page.content.length ? page.content.map(function (a) {
        return '<tr><td>' + esc(a.occurredAt ? a.occurredAt.replace('T', ' ').substring(0, 19) : '')
          + '</td><td>' + esc(a.actorName) + '</td><td><span class="pill">' + esc(a.action)
          + '</span></td><td>' + esc(a.detail || '') + '</td></tr>';
      }).join('') : '<tr><td colspan="4" class="empty">No activity yet.</td></tr>';
      el('content').innerHTML = '<h2>Recent activity</h2><table><thead><tr><th>When (UTC)</th>'
        + '<th>Actor</th><th>Action</th><th>Detail</th></tr></thead><tbody>' + rows
        + '</tbody></table>';
    }).catch(showError);
  }

  function renderUsers() {
    api('/api/users').then(function (users) {
      var rows = users.map(function (u) {
        return '<tr><td>' + esc(u.fullName) + '</td><td>' + esc(u.email) + '</td><td>'
          + esc(u.phoneNumber || '-') + '</td><td>' + esc(u.role) + '</td><td>'
          + (u.active ? 'active' : 'inactive') + '</td></tr>';
      }).join('');
      el('content').innerHTML = '<h2>All users</h2><table><thead><tr><th>Name</th><th>Email</th>'
        + '<th>Phone</th><th>Role</th><th>Status</th></tr></thead><tbody>' + rows
        + '</tbody></table>';
    }).catch(showError);
  }

  function showError(e) {
    el('content').innerHTML = '<div class="empty" style="color: var(--error)">' + esc(e.message)
      + '</div>';
  }
})();
</script>
</body>
</html>
