spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

app:
  jwt:
    # startup fails if JWT_SECRET is not provided
    secret: ${JWT_SECRET}
  demo:
    enabled: false

springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false
