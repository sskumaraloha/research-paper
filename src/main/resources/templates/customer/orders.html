<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(~{::title})}">
    <title>My Orders | General Store</title>
</head>
<body class="d-flex flex-column min-vh-100 bg-light">

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="flex-grow-1 py-4">
    <div class="container">

        <h1 class="h3 fw-bold mb-4">My orders</h1>

        <div th:if="${#lists.isEmpty(orders.content)}" class="card shadow-sm border-0">
            <div class="card-body text-center py-5">
                <span class="display-3" aria-hidden="true">&#128230;</span>
                <h2 class="h5 fw-bold mt-3">No orders yet</h2>
                <p class="text-muted mb-3">Your orders will appear here after checkout.</p>
                <a th:href="@{/products}" class="btn btn-dark">Start shopping</a>
            </div>
        </div>

        <div class="card shadow-sm border-0" th:unless="${#lists.isEmpty(orders.content)}">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                        <tr>
                            <th scope="col">Order</th>
                            <th scope="col">Date</th>
                            <th scope="col" class="text-end">Items</th>
                            <th scope="col" class="text-end">Total</th>
                            <th scope="col">Status</th>
                            <th scope="col"></th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="order : ${orders.content}">
                            <td><code th:text="${order.orderNumber}">ORD-1</code></td>
                            <td class="text-muted small"
                                th:text="${#temporals.format(order.createdAt, 'dd MMM yyyy HH:mm')}">date</td>
                            <td class="text-end" th:text="${order.totalItems}">2</td>
                            <td class="text-end fw-semibold"
                                th:text="'₹' + ${#numbers.formatDecimal(order.totalAmount, 1, 2)}">₹0</td>
                            <td>
                                <span class="badge"
                                      th:classappend="${order.status.name() == 'DELIVERED'} ? 'text-bg-success'
                                                      : (${order.status.name() == 'CANCELLED'} ? 'text-bg-secondary' : 'text-bg-warning')"
                                      th:text="${order.status}">PENDING</span>
                            </td>
                            <td class="text-end">
                                <a th:href="@{/customer/orders/{id}(id=${order.id})}"
                                   class="btn btn-sm btn-outline-dark">View</a>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <nav th:if="${orders.totalPages > 1}" aria-label="Order pages" class="mt-3">
            <ul class="pagination justify-content-center mb-0">
                <li class="page-item"
                    th:each="i : ${#numbers.sequence(0, orders.totalPages - 1)}"
                    th:classappend="${i == orders.page} ? 'active'">
                    <a class="page-link" th:text="${i + 1}"
                       th:href="@{/customer/orders(page=${i})}">1</a>
                </li>
            </ul>
        </nav>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>

</body>
</html>
