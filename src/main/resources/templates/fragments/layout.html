<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<!-- ============================================================
     Shared <head> fragment.
     Usage: <head th:replace="~{fragments/layout :: head(~{::title})}">
     ============================================================ -->
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:replace="${title}">Store Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<!-- ============================================================
     Navbar fragment.
     Usage: <nav th:replace="~{fragments/layout :: navbar}">
     ============================================================ -->
<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand fw-semibold" th:href="@{/}">
            <span class="text-warning">&#128722;</span> General Store
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#mainNavbar" aria-controls="mainNavbar"
                aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNavbar">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link active" th:href="@{/}">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/health}">Health</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/register}">Register</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- ============================================================
     Footer fragment.
     Usage: <footer th:replace="~{fragments/layout :: footer}">
     ============================================================ -->
<footer th:fragment="footer" class="footer bg-dark text-light py-4 mt-auto">
    <div class="container text-center">
        <p class="mb-1 fw-semibold">Store Management System</p>
        <p class="mb-0 small text-secondary">
            Groceries &middot; Clothing &middot; Household &middot; Personal Care &middot; Daily Essentials
        </p>
    </div>
</footer>

<!-- ============================================================
     Shared scripts fragment.
     Usage: <th:block th:replace="~{fragments/layout :: scripts}">
     ============================================================ -->
<th:block th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/main.js}"></script>
</th:block>

</body>
</html>
