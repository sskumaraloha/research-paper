<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(~{::title})}">
    <title>Dashboard | Admin</title>
</head>
<body class="bg-light">

<div class="container-fluid">
    <div class="row min-vh-100">

        <aside th:replace="~{fragments/admin-layout :: sidebar('dashboard')}"></aside>

        <div class="col-12 col-lg-10 p-0 d-flex flex-column">

            <header th:replace="~{fragments/admin-layout :: topbar('Dashboard')}"></header>

            <main class="p-4 flex-grow-1">

                <!-- Headline stats -->
                <div class="row g-3 mb-4">
                    <div class="col-6 col-md-3">
                        <div class="card border-0 shadow-sm h-100">
                            <div class="card-body">
                                <p class="text-muted small text-uppercase mb-1">Total sales</p>
                                <p class="h4 fw-bold mb-0"
                                   th:text="'₹' + ${#numbers.formatDecimal(stats.totalSales, 1, 2)}">₹0</p>
                            </div>
                        </div>
                    </div>
                    <div class="col-6 col-md-3">
                        <div class="card border-0 shadow-sm h-100">
                            <div class="card-body">
                                <p class="text-muted small text-uppercase mb-1">Total orders</p>
                                <p class="h4 fw-bold mb-0" th:text="${stats.totalOrders}">0</p>
                                <p class="small text-muted mb-0">
                                    <span th:text="${stats.todaysOrders}">0</span> today
                                </p>
                            </div>
                        </div>
                    </div>
                    <div class="col-6 col-md-3">
                        <div class="card border-0 shadow-sm h-100">
                            <div class="card-body">
                                <p class="text-muted small text-uppercase mb-1">Customers</p>
                                <p class="h4 fw-bold mb-0" th:text="${stats.totalCustomers}">0</p>
                            </div>
                        </div>
                    </div>
                    <div class="col-6 col-md-3">
                        <div class="card border-0 shadow-sm h-100">
                            <div class="card-body">
                                <p class="text-muted small text-uppercase mb-1">Products</p>
                                <p class="h4 fw-bold mb-0" th:text="${stats.totalProducts}">0</p>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Stock alerts -->
                <div class="row g-3 mb-4">
                    <div class="col-6">
                        <a th:href="@{/admin/inventory/low-stock}"
                           class="card border-0 shadow-sm text-decoration-none h-100">
                            <div class="card-body d-flex justify-content-between align-items-center">
                                <div>
                                    <p class="text-muted small text-uppercase mb-1">Low stock products</p>
                                    <p class="h4 fw-bold mb-0 text-warning"
                                       th:text="${stats.lowStockProducts}">0</p>
                                </div>
                                <span class="fs-1" aria-hidden="true">&#9888;&#65039;</span>
                            </div>
                        </a>
                    </div>
                    <div class="col-6">
                        <a th:href="@{/admin/inventory/out-of-stock}"
                           class="card border-0 shadow-sm text-decoration-none h-100">
                            <div class="card-body d-flex justify-content-between align-items-center">
                                <div>
                                    <p class="text-muted small text-uppercase mb-1">Out of stock products</p>
                                    <p class="h4 fw-bold mb-0 text-danger"
                                       th:text="${stats.outOfStockProducts}">0</p>
                                </div>
                                <span class="fs-1" aria-hidden="true">&#128683;</span>
                            </div>
                        </a>
                    </div>
                </div>

                <div class="row g-4">
                    <!-- Recent orders -->
                    <div class="col-12 col-xl-7">
                        <div class="card border-0 shadow-sm">
                            <div class="card-header bg-white fw-bold">Recent orders</div>
                            <div class="card-body p-0">
                                <div class="table-responsive">
                                    <table class="table table-hover align-middle mb-0">
                                        <thead class="table-light">
                                        <tr>
                                            <th scope="col">Order</th>
                                            <th scope="col">Customer</th>
                                            <th scope="col">Date</th>
                                            <th scope="col" class="text-end">Total</th>
                                            <th scope="col">Status</th>
                                        </tr>
                                        </thead>
                                        <tbody>
                                        <tr th:if="${#lists.isEmpty(recentOrders)}">
                                            <td colspan="5" class="text-center text-muted py-4">
                                                No orders yet.
                                            </td>
                                        </tr>
                                        <tr th:each="order : ${recentOrders}">
                                            <td>
                                                <a th:href="@{/admin/orders/{id}(id=${order.id})}"
                                                   class="text-decoration-none">
                                                    <code th:text="${order.orderNumber}">ORD</code>
                                                </a>
                                            </td>
                                            <td th:text="${order.customerName}">Customer</td>
                                            <td class="text-muted small"
                                                th:text="${#temporals.format(order.createdAt, 'dd MMM HH:mm')}">date</td>
                                            <td class="text-end fw-semibold"
                                                th:text="'₹' + ${#numbers.formatDecimal(order.totalAmount, 1, 2)}">₹0</td>
                                            <td>
                                                <span class="badge"
                                                      th:classappend="${order.status.name() == 'DELIVERED'} ? 'text-bg-success'
                                                                      : (${order.status.name() == 'CANCELLED'} ? 'text-bg-secondary' : 'text-bg-warning')"
                                                      th:text="${order.status}">PENDING</span>
                                            </td>
                                        </tr>
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Top selling products -->
                    <div class="col-12 col-xl-5">
                        <div class="card border-0 shadow-sm">
                            <div class="card-header bg-white fw-bold">Top selling products</div>
                            <div class="card-body p-0">
                                <div class="table-responsive">
                                    <table class="table table-hover align-middle mb-0">
                                        <thead class="table-light">
                                        <tr>
                                            <th scope="col">Product</th>
                                            <th scope="col" class="text-end">Units sold</th>
                                            <th scope="col" class="text-end">Revenue</th>
                                        </tr>
                                        </thead>
                                        <tbody>
                                        <tr th:if="${#lists.isEmpty(topProducts)}">
                                            <td colspan="3" class="text-center text-muted py-4">
                                                No sales data yet.
                                            </td>
                                        </tr>
                                        <tr th:each="product : ${topProducts}">
                                            <td>
                                                <span class="fw-semibold" th:text="${product.productName}">Product</span>
                                                <code class="small d-block" th:text="${product.sku}">SKU</code>
                                            </td>
                                            <td class="text-end" th:text="${product.unitsSold}">0</td>
                                            <td class="text-end fw-semibold"
                                                th:text="'₹' + ${#numbers.formatDecimal(product.revenue, 1, 2)}">₹0</td>
                                        </tr>
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>
</div>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>

</body>
</html>
