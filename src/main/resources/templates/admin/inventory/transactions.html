<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(~{::title})}">
    <title>Inventory History | Admin</title>
</head>
<body class="d-flex flex-column min-vh-100 bg-light">

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="flex-grow-1 py-4">
    <div class="container">

        <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
            <div>
                <h1 class="h3 fw-bold mb-1">Inventory history</h1>
                <p class="text-muted mb-0" th:if="${productId == null}">
                    All stock movements, newest first
                </p>
                <p class="text-muted mb-0" th:if="${productId != null}">
                    Movements for one product —
                    <a th:href="@{/admin/inventory/transactions}">show all</a>
                </p>
            </div>
            <a th:href="@{/admin/inventory}" class="btn btn-outline-dark">Back to inventory</a>
        </div>

        <div class="card shadow-sm border-0">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                        <tr>
                            <th scope="col">Date</th>
                            <th scope="col">Product</th>
                            <th scope="col">Type</th>
                            <th scope="col" class="text-end">Quantity</th>
                            <th scope="col" class="text-end">Stock before &#8594; after</th>
                            <th scope="col">Reference</th>
                            <th scope="col">Remarks</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:if="${#lists.isEmpty(transactions.content)}">
                            <td colspan="7" class="text-center text-muted py-4">
                                No stock movements recorded yet.
                            </td>
                        </tr>
                        <tr th:each="txn : ${transactions.content}">
                            <td class="text-muted small"
                                th:text="${#temporals.format(txn.createdAt, 'dd MMM yyyy HH:mm')}">
                                01 Jan 2026
                            </td>
                            <td>
                                <span class="fw-semibold" th:text="${txn.productName}">Rice</span>
                                <code class="small d-block" th:text="${txn.sku}">SKU</code>
                            </td>
                            <td>
                                <span class="badge"
                                      th:classappend="${txn.transactionType.name() == 'PURCHASE' or txn.transactionType.name() == 'RETURN'}
                                                      ? 'text-bg-success'
                                                      : (${txn.transactionType.name() == 'ADJUSTMENT'} ? 'text-bg-secondary' : 'text-bg-danger')"
                                      th:text="${txn.transactionType}">PURCHASE</span>
                            </td>
                            <td class="text-end fw-semibold">
                                <span th:text="${txn.newStock >= txn.previousStock ? '+' : '-'} + ${txn.quantity}">+5</span>
                            </td>
                            <td class="text-end">
                                <span th:text="${txn.previousStock}">10</span>
                                &#8594;
                                <span class="fw-semibold" th:text="${txn.newStock}">15</span>
                            </td>
                            <td th:text="${txn.reference} ?: '—'">—</td>
                            <td class="text-muted small" th:text="${txn.remarks} ?: '—'">—</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Pagination -->
        <nav th:if="${transactions.totalPages > 1}" aria-label="History pages" class="mt-3">
            <ul class="pagination justify-content-center mb-0">
                <li class="page-item"
                    th:each="i : ${#numbers.sequence(0, transactions.totalPages - 1)}"
                    th:classappend="${i == transactions.page} ? 'active'">
                    <a class="page-link" th:text="${i + 1}"
                       th:href="@{/admin/inventory/transactions(page=${i}, productId=${productId})}">1</a>
                </li>
            </ul>
        </nav>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>

</body>
</html>
