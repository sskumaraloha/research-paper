<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(~{::title})}">
    <title>Categories | Admin</title>
</head>
<body class="d-flex flex-column min-vh-100 bg-light">

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="flex-grow-1 py-4">
    <div class="container">

        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h1 class="h3 fw-bold mb-1">Categories</h1>
                <p class="text-muted mb-0">Manage the product category hierarchy</p>
            </div>
            <a th:href="@{/admin/categories/new}" class="btn btn-dark">+ New category</a>
        </div>

        <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
            <span th:text="${successMessage}">Done.</span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <span th:text="${errorMessage}">Error.</span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <div class="card shadow-sm border-0">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                        <tr>
                            <th scope="col">Name</th>
                            <th scope="col">Slug</th>
                            <th scope="col">Parent</th>
                            <th scope="col">Status</th>
                            <th scope="col" class="text-end">Actions</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:if="${#lists.isEmpty(categories)}">
                            <td colspan="5" class="text-center text-muted py-4">
                                No categories yet. Create the first one.
                            </td>
                        </tr>
                        <tr th:each="category : ${categories}">
                            <td class="fw-semibold" th:text="${category.name}">Men</td>
                            <td><code th:text="${category.slug}">men</code></td>
                            <td th:text="${category.parentName} ?: '—'">—</td>
                            <td>
                                <span th:if="${category.active}" class="badge text-bg-success">Active</span>
                                <span th:unless="${category.active}" class="badge text-bg-secondary">Inactive</span>
                            </td>
                            <td class="text-end">
                                <div class="d-inline-flex gap-1">
                                    <a th:href="@{/admin/categories/{id}/edit(id=${category.id})}"
                                       class="btn btn-sm btn-outline-secondary">Edit</a>
                                    <form th:action="@{/admin/categories/{id}/toggle(id=${category.id})}"
                                          method="post" class="d-inline">
                                        <button type="submit" class="btn btn-sm btn-outline-secondary"
                                                th:text="${category.active} ? 'Deactivate' : 'Activate'">
                                            Deactivate
                                        </button>
                                    </form>
                                    <form th:action="@{/admin/categories/{id}/delete(id=${category.id})}"
                                          method="post" class="d-inline"
                                          th:attr="onsubmit=|return confirm('Delete category &quot;${category.name}&quot;? This cannot be undone.');|">
                                        <button type="submit" class="btn btn-sm btn-outline-danger">Delete</button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>

</body>
</html>
