spring:
  application:
    name: Store Management System

  profiles:
    active: dev

  jpa:
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  thymeleaf:
    encoding: UTF-8
    mode: HTML

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

# JWT settings for REST API authentication (secret is profile-specific)
app:
  jwt:
    expiration-minutes: 60

# OTP settings (delivery provider and limits)
otp:
  provider: dummy          # dummy = log to console; e.g. twilio once integrated
  expiry-minutes: 5
  max-attempts: 5
  resend-cooldown-seconds: 60
  max-requests-per-hour: 5

server:
  port: 8080
  error:
    include-message: always
    include-stacktrace: never
