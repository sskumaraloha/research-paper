spring:
  datasource:
    url: jdbc:mysql://localhost:3306/mip_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

app:
  jwt:
    # dev-only HMAC key (base64, 256 bit) - never use in prod
    secret: ZGV2LW9ubHktc2VjcmV0LWtleS1mb3ItbWlwLWRldi1wcm9maWxlLTAxMjM0NTY3ODk=
  demo:
    enabled: true

springdoc:
  swagger-ui:
    enabled: true
  api-docs:
    enabled: true

logging:
  level:
    com.mip: DEBUG
