<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(~{::title})}">
    <title>Orders | Admin</title>
</head>
<body class="bg-light">

<div class="container-fluid">
    <div class="row min-vh-100">

        <aside th:replace="~{fragments/admin-layout :: sidebar('orders')}"></aside>

        <div class="col-12 col-lg-10 p-0 d-flex flex-column">

            <header th:replace="~{fragments/admin-layout :: topbar('Orders')}"></header>

            <main class="p-4 flex-grow-1">

                <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
                    <span th:text="${successMessage}">Done.</span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
                <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
                    <span th:text="${errorMessage}">Error.</span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>

                <!-- Filters -->
                <form th:action="@{/admin/orders}" method="get" class="row g-2 mb-4">
                    <div class="col-12 col-md-4 col-xl-3">
                        <input type="text" name="search" class="form-control" th:value="${search}"
                               placeholder="Order no., customer, phone">
                    </div>
                    <div class="col-6 col-md-3 col-xl-2">
                        <select name="status" class="form-select" aria-label="Filter by status">
                            <option value="">All statuses</option>
                            <option th:each="option : ${statusOptions}"
                                    th:value="${option}"
                                    th:text="${option}"
                                    th:selected="${option == status}">PENDING</option>
                        </select>
                    </div>
                    <div class="col-6 col-md-2">
                        <input type="date" name="fromDate" class="form-control"
                               th:value="${fromDate}" aria-label="From date">
                    </div>
                    <div class="col-6 col-md-2">
                        <input type="date" name="toDate" class="form-control"
                               th:value="${toDate}" aria-label="To date">
                    </div>
                    <div class="col-6 col-md-1 d-flex gap-1">
                        <button type="submit" class="btn btn-dark w-100">Filter</button>
                    </div>
                    <div class="col-12 col-xl-1">
                        <a th:href="@{/admin/orders}" class="btn btn-outline-secondary w-100">Clear</a>
                    </div>
                </form>

                <div class="card shadow-sm border-0">
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead class="table-light">
                                <tr>
                                    <th scope="col">Order</th>
                                    <th scope="col">Customer</th>
                                    <th scope="col">Date</th>
                                    <th scope="col" class="text-end">Items</th>
                                    <th scope="col" class="text-end">Total</th>
                                    <th scope="col">Payment</th>
                                    <th scope="col">Status</th>
                                    <th scope="col"></th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr th:if="${#lists.isEmpty(orders.content)}">
                                    <td colspan="8" class="text-center text-muted py-4">
                                        No orders match these filters.
                                    </td>
                                </tr>
                                <tr th:each="order : ${orders.content}">
                                    <td><code th:text="${order.orderNumber}">ORD</code></td>
                                    <td>
                                        <span th:text="${order.customerName}">Customer</span>
                                        <span class="text-muted small d-block"
                                              th:text="${order.customerPhone}">phone</span>
                                    </td>
                                    <td class="text-muted small"
                                        th:text="${#temporals.format(order.createdAt, 'dd MMM yyyy HH:mm')}">date</td>
                                    <td class="text-end" th:text="${order.totalItems}">1</td>
                                    <td class="text-end fw-semibold"
                                        th:text="'₹' + ${#numbers.formatDecimal(order.totalAmount, 1, 2)}">₹0</td>
                                    <td>
                                        <span class="small"
                                              th:text="${order.paymentMethod.name() == 'CASH_ON_DELIVERY'} ? 'COD' : 'Online'">COD</span>
                                        <span class="badge"
                                              th:classappend="${order.paymentStatus.name() == 'PAID'} ? 'text-bg-success'
                                                              : (${order.paymentStatus.name() == 'PENDING'} ? 'text-bg-warning' : 'text-bg-secondary')"
                                              th:text="${order.paymentStatus}">PENDING</span>
                                    </td>
                                    <td>
                                        <span class="badge"
                                              th:classappend="${order.status.name() == 'DELIVERED'} ? 'text-bg-success'
                                                              : (${order.status.name() == 'CANCELLED'} ? 'text-bg-secondary' : 'text-bg-warning')"
                                              th:text="${order.status}">PENDING</span>
                                    </td>
                                    <td class="text-end">
                                        <a th:href="@{/admin/orders/{id}(id=${order.id})}"
                                           class="btn btn-sm btn-outline-dark">Manage</a>
                                    </td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <nav th:if="${orders.totalPages > 1}" aria-label="Order pages" class="mt-3">
                    <ul class="pagination justify-content-center mb-0">
                        <li class="page-item"
                            th:each="i : ${#numbers.sequence(0, orders.totalPages - 1)}"
                            th:classappend="${i == orders.page} ? 'active'">
                            <a class="page-link" th:text="${i + 1}"
                               th:href="@{/admin/orders(page=${i}, search=${search}, status=${status},
                                          fromDate=${fromDate}, toDate=${toDate})}">1</a>
                        </li>
                    </ul>
                </nav>
            </main>
        </div>
    </div>
</div>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>

</body>
</html>
