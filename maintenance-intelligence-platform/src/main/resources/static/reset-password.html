<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Set New Password</title>
<style>
  :root {
    --bg: #f4f6f8; --card: #ffffff; --text: #1f2933; --muted: #6b7280;
    --accent: #2563eb; --accent-dark: #1d4ed8; --error: #b91c1c; --ok: #15803d;
    --border: #d1d5db;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111827; --card: #1f2937; --text: #f3f4f6; --muted: #9ca3af;
      --accent: #3b82f6; --accent-dark: #2563eb; --error: #f87171; --ok: #4ade80;
      --border: #374151;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 16px;
  }
  .card {
    background: var(--card); border-radius: 12px; padding: 32px; width: 100%; max-width: 400px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.08);
  }
  h1 { font-size: 1.3rem; margin: 0 0 6px; }
  p.sub { color: var(--muted); font-size: 0.9rem; margin: 0 0 22px; }
  label { display: block; font-size: 0.85rem; margin: 14px 0 6px; }
  input {
    width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px;
    background: transparent; color: var(--text); font-size: 1rem;
  }
  input:focus { outline: 2px solid var(--accent); border-color: transparent; }
  button {
    width: 100%; margin-top: 22px; padding: 11px; border: none; border-radius: 8px;
    background: var(--accent); color: #fff; font-size: 1rem; font-weight: 600; cursor: pointer;
  }
  button:hover { background: var(--accent-dark); }
  button:disabled { opacity: 0.6; cursor: not-allowed; }
  .msg { margin-top: 16px; font-size: 0.9rem; min-height: 1.2em; }
  .msg.error { color: var(--error); }
  .msg.ok { color: var(--ok); }
  .hidden { display: none; }
</style>
</head>
<body>
<div class="card">
  <h1>Set a new password</h1>
  <p class="sub">Maintenance Intelligence Platform</p>

  <form id="resetForm" class="hidden">
    <label for="password">New password (at least 8 characters)</label>
    <input type="password" id="password" minlength="8" maxlength="100" required autocomplete="new-password">
    <label for="confirm">Confirm new password</label>
    <input type="password" id="confirm" minlength="8" maxlength="100" required autocomplete="new-password">
    <button type="submit" id="submitBtn">Update password</button>
  </form>

  <div id="message" class="msg" role="alert">Checking your reset link&hellip;</div>
</div>

<script>
(function () {
  var token = new URLSearchParams(window.location.search).get('token');
  var form = document.getElementById('resetForm');
  var message = document.getElementById('message');
  var submitBtn = document.getElementById('submitBtn');

  function show(text, kind) {
    message.textContent = text;
    message.className = 'msg' + (kind ? ' ' + kind : '');
  }

  if (!token) {
    show('This link is missing its token. Please use the link from your email.', 'error');
    return;
  }

  fetch('/api/auth/reset-password/validate?token=' + encodeURIComponent(token))
    .then(function (res) {
      if (res.ok) {
        form.classList.remove('hidden');
        show('', '');
      } else {
        return res.json().then(function (body) {
          show(body.message || 'This reset link is invalid or has expired.', 'error');
        });
      }
    })
    .catch(function () { show('Could not reach the server. Try again later.', 'error'); });

  form.addEventListener('submit', function (event) {
    event.preventDefault();
    var password = document.getElementById('password').value;
    var confirm = document.getElementById('confirm').value;
    if (password !== confirm) {
      show('Passwords do not match.', 'error');
      return;
    }
    submitBtn.disabled = true;
    fetch('/api/auth/reset-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token: token, newPassword: password })
    })
      .then(function (res) {
        return res.json().then(function (body) {
          if (res.ok) {
            form.classList.add('hidden');
            show(body.message || 'Password updated. You can now log in.', 'ok');
          } else {
            submitBtn.disabled = false;
            show(body.message || 'Password could not be updated.', 'error');
          }
        });
      })
      .catch(function () {
        submitBtn.disabled = false;
        show('Could not reach the server. Try again later.', 'error');
      });
  });
})();
</script>
</body>
</html>
