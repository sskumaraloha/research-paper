<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<!-- ============================================================
     Shared <head> fragment.
     Usage: <head th:replace="~{fragments/layout :: head(~{::title})}">
     ============================================================ -->
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:replace="${title}">Store Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<!-- ============================================================
     Navbar fragment.
     Usage: <nav th:replace="~{fragments/layout :: navbar}">
     ============================================================ -->
<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand fw-semibold" th:href="@{/}">
            <span class="text-warning">&#128722;</span> General Store
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#mainNavbar" aria-controls="mainNavbar"
                aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNavbar">
            <form th:action="@{/products}" method="get"
                  class="d-flex flex-grow-1 mx-lg-4 my-2 my-lg-0" role="search">
                <div class="input-group">
                    <input type="search" name="search" class="form-control"
                           placeholder="Search products..."
                           aria-label="Search products">
                    <button type="submit" class="btn btn-warning" aria-label="Search">
                        &#128269;
                    </button>
                </div>
            </form>
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/products}">Shop</a>
                </li>
                <li class="nav-item dropdown"
                    th:if="${navCategories != null and !#lists.isEmpty(navCategories)}">
                    <a class="nav-link dropdown-toggle" href="#" role="button"
                       data-bs-toggle="dropdown" aria-expanded="false">Categories</a>
                    <ul class="dropdown-menu dropdown-menu-end">
                        <li th:each="cat : ${navCategories}">
                            <a class="dropdown-item"
                               th:href="@{/products(category=${cat.slug})}"
                               th:text="${cat.name}">Grocery</a>
                        </li>
                    </ul>
                </li>
                <li class="nav-item dropdown" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link dropdown-toggle" href="#" role="button"
                       data-bs-toggle="dropdown" aria-expanded="false">Admin</a>
                    <ul class="dropdown-menu dropdown-menu-end">
                        <li><a class="dropdown-item" th:href="@{/admin/categories}">Categories</a></li>
                        <li><a class="dropdown-item" th:href="@{/admin/products}">Products</a></li>
                        <li><a class="dropdown-item" th:href="@{/admin/inventory}">Inventory</a></li>
                    </ul>
                </li>
                <li class="nav-item" sec:authorize="isAnonymous()">
                    <a class="nav-link" th:href="@{/register}">Register</a>
                </li>
                <li class="nav-item" sec:authorize="isAnonymous()">
                    <a class="nav-link" th:href="@{/login}">Login</a>
                </li>
                <li class="nav-item dropdown" sec:authorize="hasRole('CUSTOMER')">
                    <a class="nav-link dropdown-toggle" href="#" role="button"
                       data-bs-toggle="dropdown" aria-expanded="false">My Account</a>
                    <ul class="dropdown-menu dropdown-menu-end">
                        <li><a class="dropdown-item" th:href="@{/customer/wishlist}">Wishlist</a></li>
                        <li><a class="dropdown-item" th:href="@{/customer/addresses}">Addresses</a></li>
                    </ul>
                </li>
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <a class="nav-link" th:href="@{/cart}">
                        Cart
                        <span th:if="${cartItemCount != null and cartItemCount > 0}"
                              class="badge text-bg-warning ms-1" th:text="${cartItemCount}">0</span>
                    </a>
                </li>
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <span class="nav-link text-secondary" sec:authentication="name">user</span>
                </li>
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <form th:action="@{/logout}" method="post" class="d-inline">
                        <button type="submit" class="btn btn-link nav-link">Logout</button>
                    </form>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- ============================================================
     Footer fragment.
     Usage: <footer th:replace="~{fragments/layout :: footer}">
     ============================================================ -->
<footer th:fragment="footer" class="footer bg-dark text-light py-4 mt-auto">
    <div class="container text-center">
        <p class="mb-1 fw-semibold">Store Management System</p>
        <p class="mb-0 small text-secondary">
            Groceries &middot; Clothing &middot; Household &middot; Personal Care &middot; Daily Essentials
        </p>
    </div>
</footer>

<!-- ============================================================
     Shared scripts fragment.
     Usage: <th:block th:replace="~{fragments/layout :: scripts}">
     ============================================================ -->
<th:block th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/main.js}"></script>
</th:block>

</body>
</html>
