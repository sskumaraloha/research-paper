<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(~{::title})}">
    <title>My Addresses | General Store</title>
</head>
<body class="d-flex flex-column min-vh-100 bg-light">

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="flex-grow-1 py-4">
    <div class="container">

        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="h3 fw-bold mb-0">My addresses</h1>
            <a th:href="@{/customer/addresses/new}" class="btn btn-dark">+ Add address</a>
        </div>

        <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
            <span th:text="${successMessage}">Done.</span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <span th:text="${errorMessage}">Error.</span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <div th:if="${#lists.isEmpty(addresses)}" class="card shadow-sm border-0">
            <div class="card-body text-center py-5">
                <span class="display-3" aria-hidden="true">&#127968;</span>
                <h2 class="h5 fw-bold mt-3">No addresses yet</h2>
                <p class="text-muted mb-3">Add a delivery address to speed up checkout.</p>
                <a th:href="@{/customer/addresses/new}" class="btn btn-dark">Add your first address</a>
            </div>
        </div>

        <div class="row g-3" th:unless="${#lists.isEmpty(addresses)}">
            <div class="col-12 col-md-6 col-lg-4" th:each="address : ${addresses}">
                <div class="card h-100 shadow-sm border-0"
                     th:classappend="${address.defaultAddress} ? 'border border-dark'">
                    <div class="card-body d-flex flex-column">
                        <div class="d-flex justify-content-between align-items-start mb-2">
                            <h3 class="h6 fw-bold mb-0" th:text="${address.fullName}">Name</h3>
                            <span th:if="${address.defaultAddress}"
                                  class="badge text-bg-dark">Default</span>
                        </div>
                        <p class="text-muted small mb-3">
                            <span th:text="${address.addressLine1}">Line 1</span><br>
                            <th:block th:if="${address.addressLine2 != null}">
                                <span th:text="${address.addressLine2}">Line 2</span><br>
                            </th:block>
                            <span th:text="${address.city + ', ' + address.state + ' ' + address.pincode}">
                                City, State 000000</span><br>
                            <span th:text="${address.country}">India</span><br>
                            Phone: <span th:text="${address.phoneNumber}">9999999999</span>
                        </p>
                        <div class="mt-auto d-flex gap-1 flex-wrap">
                            <a th:href="@{/customer/addresses/{id}/edit(id=${address.id})}"
                               class="btn btn-sm btn-outline-secondary">Edit</a>
                            <form th:if="${!address.defaultAddress}"
                                  th:action="@{/customer/addresses/{id}/default(id=${address.id})}"
                                  method="post" class="d-inline">
                                <button type="submit" class="btn btn-sm btn-outline-dark">
                                    Make default
                                </button>
                            </form>
                            <form th:action="@{/customer/addresses/{id}/delete(id=${address.id})}"
                                  method="post" class="d-inline"
                                  onsubmit="return confirm('Delete this address?');">
                                <button type="submit" class="btn btn-sm btn-outline-danger">Delete</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>

</body>
</html>
