<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(~{::title})}">
    <title>Forgot Password | Store Management System</title>
</head>
<body class="d-flex flex-column min-vh-100 bg-light">

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="flex-grow-1 py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-md-7 col-lg-5 col-xl-4">

                <div class="card shadow-sm border-0">
                    <div class="card-body p-4 p-md-5">
                        <div class="text-center mb-4">
                            <span class="fs-1" aria-hidden="true">&#128273;</span>
                            <h1 class="h3 fw-bold mt-2">Forgot password</h1>
                            <p class="text-muted mb-0">
                                Enter your registered phone number and we will send you an OTP.
                            </p>
                        </div>

                        <div th:if="${#fields.hasGlobalErrors('forgotPasswordRequest')}"
                             class="alert alert-danger" role="alert">
                            <p class="mb-0" th:each="err : ${#fields.globalErrors('forgotPasswordRequest')}"
                               th:text="${err}">Error</p>
                        </div>

                        <form th:action="@{/forgot-password}" th:object="${forgotPasswordRequest}"
                              method="post" class="needs-validation" novalidate>

                            <div class="mb-4">
                                <label for="phoneNumber" class="form-label">Phone number</label>
                                <input type="tel" id="phoneNumber" th:field="*{phoneNumber}"
                                       class="form-control"
                                       th:classappend="${#fields.hasErrors('phoneNumber')} ? 'is-invalid'"
                                       placeholder="10-digit mobile number" required
                                       pattern="[0-9]{10}" inputmode="numeric" maxlength="10" autofocus>
                                <div class="invalid-feedback"
                                     th:if="${#fields.hasErrors('phoneNumber')}"
                                     th:errors="*{phoneNumber}">Phone error</div>
                                <div class="invalid-feedback"
                                     th:unless="${#fields.hasErrors('phoneNumber')}">
                                    Please enter exactly 10 digits.
                                </div>
                            </div>

                            <div class="d-grid">
                                <button type="submit" class="btn btn-dark btn-lg">Send OTP</button>
                            </div>
                        </form>
                    </div>
                </div>

                <p class="text-center text-muted small mt-3">
                    Remembered it? <a th:href="@{/login}">Back to login</a>
                </p>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>

</body>
</html>
